# Lint and the full test suite on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.6
      - run: ruff check src tests streamlit_app.py app_pages

  python-3-11:
    # The minimum version. constraints-deploy.txt is not used: its numpy pin
    # needs Python 3.12, so pip picks the newest 3.11 versions instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Tests, core only (optional extras absent, their tests skip)
        run: PYTHONPATH=src python -m unittest discover -s tests
      # From the extras: requirements.txt carries the 3.12-only deploy pins.
      - run: pip install '.[embeddings,app,api,dev]'
      - name: Tests (embeddings, API and app extras installed)
        env:
          HRI_MODEL_CACHE: ${{ runner.temp }}/models
        run: PYTHONPATH=src python -m unittest discover -s tests

  full-python-3-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (embeddings, API and app extras installed)
        env:
          # Tests never download the model or call AI providers.
          HRI_MODEL_CACHE: ${{ runner.temp }}/models
        run: PYTHONPATH=src python -m unittest discover -s tests
