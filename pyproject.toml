[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-research-intelligence"
version = "0.1.0"
description = "Research-support prototype for searching and organising PubMed citations."
readme = "README.md"
requires-python = ">=3.9"
# Runtime dependencies. Keep this list identical to requirements.txt;
# tests/test_packaging.py fails if the two files disagree.
dependencies = []

[project.scripts]
hri = "hri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
