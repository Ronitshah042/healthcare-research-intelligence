# Bento Vitals theme (the owner's design). Tile colours are in app_pages/style.css.
[theme]
base = "light"
primaryColor = "#F26B4F"
backgroundColor = "#E6EEE9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#102A2B"
linkColor = "#0F3D3E"
borderColor = "#C5D4CD"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap, sans-serif"
headingFont = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap, sans-serif"
baseRadius = "12px"
buttonRadius = "12px"
metricValueFontSize = "2.4rem"
metricValueFontWeight = 700
# Numbered result chips and badges use the tile colours.
greenBackgroundColor = "#C7F0DD"
greenTextColor = "#1D4D3A"
yellowBackgroundColor = "#F5E6C4"
yellowTextColor = "#5A4210"
orangeBackgroundColor = "#FFE1CF"
orangeTextColor = "#8A3A12"
blueBackgroundColor = "#D6E6F5"
blueTextColor = "#1B3A57"
