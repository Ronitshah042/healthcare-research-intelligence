# Bento Vitals theme, owner's palette: deep teal #0F3D3E and mint #C7F0DD plus
# neutrals only. Tile and alert styles are in app_pages/style.css.
[theme]
base = "light"
primaryColor = "#0F3D3E"
backgroundColor = "#E6EEE9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#102A2B"
linkColor = "#0F3D3E"
borderColor = "#C5D4CD"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap, sans-serif"
headingFont = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap, sans-serif"
baseRadius = "12px"
buttonRadius = "12px"
metricValueFontSize = "2.4rem"
metricValueFontWeight = 700
# Badges and chips: mint ("green") and grey only.
greenColor = "#0F3D3E"
greenBackgroundColor = "#C7F0DD"
greenTextColor = "#0F3D3E"
grayBackgroundColor = "#EEF2F0"
grayTextColor = "#102A2B"
# No red, orange or yellow anywhere: anything Streamlit draws in those colours
# (its own error or warning boxes, exceptions, widget errors) uses teal on white.
redColor = "#0F3D3E"
redBackgroundColor = "#FFFFFF"
redTextColor = "#102A2B"
orangeColor = "#0F3D3E"
orangeBackgroundColor = "#FFFFFF"
orangeTextColor = "#102A2B"
yellowColor = "#0F3D3E"
yellowBackgroundColor = "#FFFFFF"
yellowTextColor = "#102A2B"
